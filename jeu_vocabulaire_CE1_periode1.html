<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les missions de vocabulaire • CE1</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4e9;color:#293e37;font-family:Arial,sans-serif}header{max-width:960px;margin:auto;padding:25px 20px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:bold;color:#607d59}h1{font-size:clamp(26px,4.5vw,38px);margin:7px 0}button{font:inherit;cursor:pointer;touch-action:manipulation;background:white;border:2px solid #b6cbb1;color:#2a4b3a;border-radius:12px;min-height:48px;padding:13px 18px;font-weight:bold}button:hover{border-color:#3f7a51}button:focus-visible{outline:3px solid #e7ac3d;outline-offset:3px}button:disabled{opacity:.55;cursor:default}.primary{background:#28644b;color:white;border-color:#28644b}main{max-width:960px;margin:auto;padding:0 20px 30px}.card{background:white;border-radius:23px;padding:30px;box-shadow:0 7px 30px #41502909;min-width:0}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:#657c5b}.bar{height:9px;background:#e6ebd9;border-radius:20px;margin:13px 0 23px;overflow:hidden}.bar span{display:block;background:#e0b04a;height:100%}h2{font-size:27px;line-height:1.5;margin:0 0 20px}.source{background:#f7f9f0;border-radius:14px;padding:18px;font-size:29px;line-height:1.7;margin-bottom:18px}.source strong{color:#225a3c}.alphabet{display:flex;gap:6px;flex-wrap:wrap}.letter-tile{display:inline-flex;justify-content:center;align-items:center;min-width:34px;height:44px;border-radius:8px;font-size:24px}.letter-tile.empty{background:#e8eedf;color:#899778}.letter-tile.target{background:#ffe8ac;border:2px dashed #c8952e}.letter-tile.solved{background:#e0efce;color:#32613d}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:22px 0}.choices button{font-size:24px;overflow-wrap:anywhere;text-align:center}.choices.letters{grid-template-columns:repeat(6,minmax(0,1fr))}.choices.letters button{font-size:31px;padding:12px 5px}.word-letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.word-letters button{font-size:36px;padding:12px 19px}.insert-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:18px 0;font-size:23px;line-height:1.7}.insert-row .word{font-weight:bold}.insert-row button{background:#fff5d8;color:#896015;min-width:44px;padding:7px;font-size:24px}.word-target{display:inline-block;background:#ffe9aa;border:2px solid #dfb250;border-radius:11px;padding:7px 17px;font-size:29px;margin:6px 0}.ordered{min-height:70px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f7f9ed;border-radius:13px;padding:15px;font-size:23px;line-height:1.5}.ordered span{padding:5px 10px;border-radius:8px;background:#e2efce}.good{background:#e0f1d5!important;border-color:#4c8c54!important}.bad{background:#fff0dd!important;border-color:#bd8540!important}.feedback{font-size:20px;line-height:1.65;min-height:40px;margin:20px 0}.hint{font-size:19px;line-height:1.6;background:#fff4d4;border-radius:12px;padding:15px;margin:15px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.next{width:100%;margin-top:18px}.note{font-size:15px;color:#65765b;line-height:1.65}.percent{font-size:clamp(33px,6vw,47px);background:#ecf5e2;color:#296345;text-align:center;font-weight:bold;padding:20px;border-radius:14px;margin:15px 0}.result-row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:15px;background:#f1f6e8;border-radius:10px;margin:10px 0;font-size:20px;line-height:1.5}.result-row strong{white-space:nowrap}[hidden]{display:none!important}@media(max-width:760px){header{padding:16px;align-items:flex-start}header>button{font-size:12px;padding:9px}main{padding:0 12px 25px}.card{padding:22px}h2{font-size:24px}.source{padding:14px;font-size:25px}.choices button{font-size:22px}.choices.letters{grid-template-columns:repeat(3,minmax(0,1fr))}.insert-row{font-size:21px;gap:7px}.insert-row button{min-height:48px}.actions button{flex:1 1 140px}.letter-tile{min-width:30px;font-size:23px}.result-row{font-size:18px}}@media(max-width:380px){.card{padding:16px}h1{font-size:25px}h2{font-size:22px}.choices{gap:9px}.choices button{font-size:20px}.word-letters{gap:6px}.word-letters button{font-size:30px;padding:10px 14px}}
</style><header><div><div class="eyebrow">CE1 · VOCABULAIRE</div><h1>Les missions de vocabulaire</h1></div><button id="restart">Recommencer</button></header><main><section class="card" id="play"><div class="top"><span id="counter"></span><span id="domain"></span></div><div class="bar" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="37"><span id="bar"></span></div><h2 id="question"></h2><div id="source" class="source"></div><div id="interactive"></div><div id="hint" class="hint" hidden></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="help" type="button">Un indice</button><button id="listen" type="button">🔊 Écouter</button></div><button id="next" class="primary next" hidden>Continuer →</button></section><section class="card" id="end" hidden><div class="eyebrow">ENTRAÎNEMENT TERMINÉ</div><h2 id="score"></h2><div id="percentage" class="percent"></div><p class="note">Le pourcentage compte les réponses réussies au premier essai, sans indice. Pour le classement des cinq mots, toute la série compte pour un défi.</p><div id="results"></div><div class="actions"><button id="again" class="primary">Rejouer les 37 défis</button><button id="review">Revoir mes difficultés</button></div></section></main><script>
const domains=['Les voyelles','Placer un mot','Les premières lettres et le classement','Les contraires'];const vowels=['a','e','i','o','u','y'];
const tasks=[...vowels.map((v,i)=>({type:'vowel',stage:0,v,index:i,q:'Quelle voyelle manque dans la case jaune ?',a:['u','a','o','y','e','i'],answer:v,hint:'Récite doucement l’alphabet pour trouver la lettre qui manque.',why:'La voyelle à cette place est « '+v+' ».'})),
{type:'insert',stage:1,q:'Où faut-il placer « dame » dans l’ordre alphabétique ?',word:'dame',row:['avion','ballon','chat','éléphant'],answer:3,hint:'Regarde les premières lettres : a, b, c, d, e.',why:'« dame » commence par d : il se place entre « chat » et « éléphant ».'},
{type:'insert',stage:1,q:'Où faut-il placer « page » dans l’ordre alphabétique ?',word:'page',row:['orange','quatre','rouge','salade'],answer:1,hint:'Regarde les premières lettres : o, p, q, r, s.',why:'« page » commence par p : il se place entre « orange » et « quatre ».'},
{type:'letter',stage:2,q:'Clique sur la première lettre du mot « nuit ».',word:'nuit',answer:0,hint:'Lis le mot de gauche à droite.',why:'La première lettre de « nuit » est n.'},
{type:'letter',stage:2,q:'Clique sur la première lettre du mot « livre ».',word:'livre',answer:0,hint:'Lis le mot de gauche à droite.',why:'La première lettre de « livre » est l.'},
{type:'order',stage:2,q:'Clique sur les cinq mots, dans l’ordre alphabétique.',a:['nuit','pierre','livre','koala','maison'],answer:['koala','livre','maison','nuit','pierre'],hint:'Compare les premières lettres : k, l, m, n, p.',why:'L’ordre est : koala, livre, maison, nuit, pierre.'},
...[
['un homme','riche','pauvre','Une personne riche a beaucoup d’argent. Son contraire est pauvre.'],['un','vieux','jeune','Un vieux sorcier est âgé. Le contraire de vieux est jeune.'],['un','grand','petit','Grand et petit sont des contraires.'],['le','dernier','premier','Le premier est au début ; le dernier est à la fin.'],['une bouteille','pleine','vide','Une bouteille pleine contient quelque chose ; une bouteille vide ne contient rien.'],['un exercice','facile','difficile','Un exercice facile se fait sans grande difficulté. Le contraire est difficile.']
].map(([prefix,word,answer,why],i)=>({type:'opposite',stage:3,q:'Clique sur le contraire du mot en gras.',source:i===1?'un <strong>vieux</strong> sorcier':i===2?'un <strong>grand</strong> chapeau':i===3?'le <strong>dernier</strong> jour':prefix+' <strong>'+word+'</strong>',a:['premier','vide','pauvre','difficile','jeune','petit'],answer,hint:'Cherche le mot qui exprime l’idée opposée.',why}))
];
const extraSeries=[
['ballon','chat','dame','éléphant','forêt'],
['avion','gâteau','lit','maison','vélo'],
['colibri','fleur','iguane','mangouste','tortue'],
['école','jardin','orange','plage','soleil'],
['arbre','bateau','crabe','hamac','yole'],
['dentiste','koala','nuage','renard','zèbre'],
['fusée','girafe','hibiscus','oiseau','quatre'],
['château','livre','nuit','pull','rue']
];
const inserted=extraSeries.map((words,i)=>{const sorted=[...words].sort((a,b)=>a.localeCompare(b,'fr'));return {type:'order',stage:2,q:'Série '+(i+2)+' : classe les cinq mots en regardant seulement leur première lettre.',a:[sorted[3],sorted[1],sorted[4],sorted[0],sorted[2]],answer:sorted,hint:'Compare uniquement les premières lettres : '+sorted.map(w=>w[0]).join(', ')+'.',why:'L’ordre est : '+sorted.join(', ')+'.'}});
const insertAt=tasks.findIndex(t=>t.stage===3);tasks.splice(insertAt,0,...inserted);
const newOpposites=[
['un chocolat <strong>chaud</strong>','froid',['sucré','froid','grand'],'Le contraire de chaud est froid.'],
['une porte <strong>ouverte</strong>','fermée',['haute','jolie','fermée'],'Une porte peut être ouverte ou fermée.'],
['un vêtement <strong>propre</strong>','sale',['sale','neuf','léger'],'Le contraire de propre est sale.'],
['un enfant <strong>content</strong>','triste',['gentil','triste','petit'],'Content et triste expriment ici des sentiments contraires.'],
['un coureur <strong>rapide</strong>','lent',['lent','fort','jeune'],'Rapide signifie qui va vite ; lent est son contraire.'],
['un sac <strong>lourd</strong>','léger',['vide','grand','léger'],'Un sac lourd pèse beaucoup. Le contraire de lourd est léger.'],
['une corde <strong>longue</strong>','courte',['rouge','courte','fine'],'Le contraire de longue est courte.'],
['le <strong>jour</strong>','nuit',['nuit','soleil','matin'],'Le jour et la nuit sont des contraires.'],
['<strong>entrer</strong> dans la classe','sortir',['marcher','rester','sortir'],'Entrer et sortir sont des actions contraires.'],
['<strong>monter</strong> un escalier','descendre',['courir','descendre','sauter'],'Monter et descendre sont des actions contraires.'],
['<strong>ouvrir</strong> une boîte','fermer',['fermer','porter','regarder'],'Le contraire d’ouvrir est fermer.'],
['<strong>allumer</strong> la lumière','éteindre',['éclairer','éteindre','briller'],'Allumer et éteindre sont des actions contraires.']
];
newOpposites.forEach(([source,answer,a,why])=>tasks.push({type:'opposite',stage:3,q:'Clique sur le contraire du mot en gras.',source,answer,a,hint:'Cherche le mot qui exprime l’idée opposée.',why}));
const $=id=>document.getElementById(id);let order=[],pos=0,locked=false,attempted=false,helped=false,log=[],sequence=[];
function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function start(indices=tasks.map((_,i)=>i)){stop();order=[...indices];pos=0;log=[];$('play').hidden=false;$('end').hidden=true;show()}
function makeButton(text,fn){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=()=>fn(b);return b}
function show(){stop();locked=false;attempted=false;helped=false;sequence=[];const t=tasks[order[pos]];$('counter').textContent=`Défi ${pos+1} sur ${order.length}`;$('domain').textContent=domains[t.stage];$('bar').style.width=100*pos/order.length+'%';const progress=document.querySelector('[role=progressbar]');progress.setAttribute('aria-valuemax',order.length);progress.setAttribute('aria-valuenow',pos);$('question').textContent=t.q;$('source').replaceChildren();$('source').hidden=false;$('interactive').replaceChildren();$('feedback').textContent='';$('hint').hidden=true;$('help').disabled=false;$('next').hidden=true;$('next').textContent=pos===order.length-1?'Voir mon bilan →':'Continuer →';if(t.type==='vowel'){const alphabet=document.createElement('div');alphabet.className='alphabet';[...'abcdefghijklmnopqrstuvwxyz'].forEach(letter=>{const v=vowels.indexOf(letter),tile=document.createElement('span');tile.className='letter-tile'+(v===t.index?' target':v>t.index?' empty':v>=0?' solved':'');tile.textContent=v===t.index?'?':v>t.index?'…':letter;alphabet.append(tile)});$('source').append(alphabet);const choices=document.createElement('div');choices.className='choices letters';t.a.forEach(v=>choices.append(makeButton(v,b=>check(v===t.answer,b))));$('interactive').append(choices)}
else if(t.type==='insert'){$('source').textContent='Mot à placer : ';const target=document.createElement('strong');target.className='word-target';target.textContent=t.word;$('source').append(target);const row=document.createElement('div');row.className='insert-row';for(let i=0;i<=t.row.length;i++){const gap=makeButton('+',b=>check(i===t.answer,b));gap.setAttribute('aria-label',i===0?'Avant '+t.row[0]:i===t.row.length?'Après '+t.row[i-1]:'Entre '+t.row[i-1]+' et '+t.row[i]);row.append(gap);if(i<t.row.length){const word=document.createElement('span');word.className='word';word.textContent=t.row[i];row.append(word)}}$('interactive').append(row)}
else if(t.type==='letter'){$('source').hidden=true;const row=document.createElement('div');row.className='word-letters';[...t.word].forEach((letter,i)=>row.append(makeButton(letter,b=>check(i===t.answer,b))));$('interactive').append(row)}
else if(t.type==='order'){$('source').hidden=true;const result=document.createElement('div');result.className='ordered';result.id='ordered';result.setAttribute('aria-label','Les mots déjà classés');result.textContent='Ta suite apparaîtra ici.';$('interactive').append(result);const choices=document.createElement('div');choices.className='choices';t.a.forEach(word=>choices.append(makeButton(word,b=>{if(locked)return;if(word!==t.answer[sequence.length]){attempted=true;$('feedback').textContent='Essaie encore : cherche le prochain mot dans l’ordre alphabétique.';return}sequence.push(word);b.disabled=true;b.classList.add('good');$('ordered').replaceChildren();sequence.forEach(w=>{const span=document.createElement('span');span.textContent=w;$('ordered').append(span)});if(sequence.length===t.answer.length)check(true,b);else $('feedback').textContent='Bien ! Choisis le mot suivant.'})));$('interactive').append(choices)}
else{$('source').innerHTML=t.source;const choices=document.createElement('div');choices.className='choices';t.a.forEach(word=>choices.append(makeButton(word,b=>check(word===t.answer,b))));$('interactive').append(choices)}}
function check(ok,b){if(locked)return;const t=tasks[order[pos]];if(ok){locked=true;b.classList.add('good');$('feedback').textContent='⭐ Bravo ! '+t.why;$('next').hidden=false;$('help').disabled=true;document.querySelectorAll('#interactive button').forEach(x=>x.disabled=true);log.push({n:order[pos],first:!attempted&&!helped});if(t.type==='vowel'){const tile=document.querySelector('.letter-tile.target');if(tile){tile.textContent=t.answer;tile.className='letter-tile solved'}}if(t.type==='insert'){b.textContent=t.word;b.setAttribute('aria-label',t.word+' est à la bonne place')}}else{attempted=true;b.classList.add('bad');b.disabled=true;$('feedback').textContent='Essaie encore. '+t.hint}}
$('help').onclick=()=>{helped=true;$('hint').textContent=tasks[order[pos]].hint;$('hint').hidden=false};$('listen').onclick=()=>{if(!('speechSynthesis'in window)){$('feedback').textContent='La voix n’est pas disponible sur cet appareil.';return}stop();const t=tasks[order[pos]],u=new SpeechSynthesisUtterance((t.q+' '+(t.source?.replace(/<[^>]*>/g,'')||'')).replace(/[.!?]/g,' '));u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)};$('next').onclick=()=>{if(!locked)return;if(++pos<order.length)show();else finish()};function finish(){stop();$('play').hidden=true;$('end').hidden=false;const score=log.filter(r=>r.first).length;$('score').textContent=`Bravo ! ${score} / ${order.length} étoiles`;$('percentage').textContent=Math.round(100*score/order.length)+' % de réussite';$('results').replaceChildren();domains.forEach((domain,i)=>{const rows=log.filter(r=>tasks[r.n].stage===i);if(!rows.length)return;const line=document.createElement('div');line.className='result-row';const name=document.createElement('span');name.textContent=domain;const value=document.createElement('strong');const count=rows.filter(r=>r.first).length;value.textContent=count+' / '+rows.length+' · '+Math.round(100*count/rows.length)+' %';line.append(name,value);$('results').append(line)});$('review').hidden=log.every(r=>r.first)}$('restart').onclick=()=>start();$('again').onclick=()=>start();$('review').onclick=()=>start(log.filter(r=>!r.first).map(r=>r.n));start();
</script></html>
